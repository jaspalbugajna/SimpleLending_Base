<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseLend — Децентрализованные займы и депозиты</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --primary: #0052ff;
            --bg: #0b0f19;
            --card-bg: #131b2e;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #1e293b;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        
        header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; background: var(--card-bg); padding: 20px 30px; border-radius: 16px; border: 1px solid var(--border); }
        h1 { font-size: 22px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .connect-btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .connect-btn:hover { opacity: 0.85; }

        .container { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .card h2 { font-size: 22px; font-weight: 600; }
        .info { font-size: 13px; color: var(--text-secondary); background: rgba(255,255,255,0.03); padding: 10px 14px; border-radius: 8px; border-left: 3px solid var(--primary); }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
        select, input { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; color: var(--text); font-size: 16px; outline: none; transition: 0.2s; }
        select:focus, input:focus { border-color: var(--primary); }
        
        .action-btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .action-btn:hover { opacity: 0.85; }
        
        .status { margin-top: 15px; font-size: 14px; text-align: center; color: var(--success); min-height: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ BaseLend Protocol</h1>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Подключить кошелек</button>
    </header>

    <div class="container">
        <!-- Карточка депозита -->
        <div class="card">
            <h2>Депозит</h2>
            <div class="info">Комиссия протокола: 0.5% при внесении</div>
            <div class="form-group">
                <label>Выберите актив</label>
                <select id="depositToken">
                    <option value="ETH">ETH (WETH)</option>
                    <option value="USDbC">USDbC</option>
                    <option value="USDC">USDC</option>
                </select>
            </div>
            <div class="form-group">
                <label>Сумма</label>
                <input type="number" id="depositAmount" placeholder="0.0" step="any">
            </div>
            <button class="action-btn" onclick="depositTokens()">Внести депозит</button>
            <div id="depositStatus" class="status"></div>
        </div>

        <!-- Карточка займа -->
        <div class="card">
            <h2>Займ</h2>
            <div class="info">Комиссия протокола: 1.0% при получении</div>
            <div class="form-group">
                <label>Выберите актив</label>
                <select id="borrowToken">
                    <option value="ETH">ETH (WETH)</option>
                    <option value="USDbC">USDbC</option>
                    <option value="USDC">USDC</option>
                </select>
            </div>
            <div class="form-group">
                <label>Сумма</label>
                <input type="number" id="borrowAmount" placeholder="0.0" step="any">
            </div>
            <button class="action-btn" onclick="borrowTokens()">Взять в долг</button>
            <div id="borrowStatus" class="status"></div>
        </div>
    </div>

    <script>
        // Вставь сюда адрес твоего успешно задеплоенного контракта:
        const CONTRACT_ADDRESS = "0xТВОЙ_АДРЕС_КОНТРАКТА_ЗДЕСЬ";

        const tokens = {
            "ETH": "0x4200000000000000000000000000000000000006",
            "USDbC": "0xd9aAEc86B65D86f6a7B5B1b0c42FFA531710b6CA",
            "USDC": "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
        };

        const abi = [
            "function deposit(address token, uint256 amount) external",
            "function borrow(address token, uint256 amount) external"
        ];

        let provider, signer, userAddress;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    userAddress = await signer.getAddress();
                    document.getElementById("connectBtn").innerText = userAddress.substring(0, 6) + "..." + userAddress.substring(38);
                } catch (err) {
                    console.error(err);
                }
            } else {
                alert("Установите MetaMask!");
            }
        }

        async function depositTokens() {
            const statusEl = document.getElementById("depositStatus");
            statusEl.innerText = "";
            try {
                if (!signer) { await connectWallet(); }
                const tokenSymbol = document.getElementById("depositToken").value;
                const amountInput = document.getElementById("depositAmount").value;
                if (!amountInput || amountInput <= 0) { alert("Введите корректную сумму"); return; }

                const contract = new ethers.Contract(CONTRACT_ADDRESS, abi, signer);
                const tokenAddr = tokens[tokenSymbol];
                const amountParsed = ethers.utils.parseUnits(amountInput, 18);
                
                statusEl.innerText = "Подтвердите транзакцию...";
                const tx = await contract.deposit(tokenAddr, amountParsed);
                statusEl.innerText = "Ожидание подтверждения сети...";
                await tx.wait();
                statusEl.innerText = "Депозит успешно выполнен! ✅";
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Ошибка: " + (err.reason || err.message);
            }
        }

        async function borrowTokens() {
            const statusEl = document.getElementById("borrowStatus");
            statusEl.innerText = "";
            try {
                if (!signer) { await connectWallet(); }
                const tokenSymbol = document.getElementById("borrowToken").value;
                const amountInput = document.getElementById("borrowAmount").value;
                if (!amountInput || amountInput <= 0) { alert("Введите корректную сумму"); return; }

                const contract = new ethers.Contract(CONTRACT_ADDRESS, abi, signer);
                const tokenAddr = tokens[tokenSymbol];
                const amountParsed = ethers.utils.parseUnits(amountInput, 18);
                
                statusEl.innerText = "Подтвердите транзакцию...";
                const tx = await contract.borrow(tokenAddr, amountParsed);
                statusEl.innerText = "Ожидание подтверждения сети...";
                await tx.wait();
                statusEl.innerText = "Займ успешно получен! ✅";
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Ошибка: " + (err.reason || err.message);
            }
        }
    </script>
</body>
</html>
