<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseLend - Simple Crypto Lending</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root { --primary: #0052ff; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --text-secondary: #94a3b8; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 24px; color: var(--primary); }
        .connect-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .config-box { width: 100%; max-width: 800px; margin-bottom: 24px; background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .container { width: 100%; max-width: 800px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 14px; color: var(--text-secondary); }
        select, input { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); font-size: 16px; outline: none; }
        .action-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>BaseLend 🚀</h1>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </header>

    <div class="config-box">
        <label for="contractAddress">Smart Contract Address:</label>
        <input type="text" id="contractAddress" placeholder="0xB0d7f384D68EeE0b25d09405483fA9b59F6Bb88B" />
    </div>

    <div class="container">
        <div class="card">
            <h2>Deposit</h2>
            <p style="font-size:12px; color:#94a3b8;">Fee: 0.5%</p>
            <div class="form-group">
                <label>Token</label>
                <select id="depositToken">
                    <option value="ETH">ETH</option>
                    <option value="USDbC">USDbC</option>
                    <option value="USDC">USDC</option>
                </select>
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="depositAmount" placeholder="0.0">
            </div>
            <button class="action-btn" onclick="depositTokens()">Deposit</button>
        </div>

        <div class="card">
            <h2>Borrow</h2>
            <p style="font-size:12px; color:#94a3b8;">Fee: 1.0%</p>
            <div class="form-group">
                <label>Token</label>
                <select id="borrowToken">
                    <option value="ETH">ETH</option>
                    <option value="USDbC">USDbC</option>
                    <option value="USDC">USDC</option>
                </select>
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="borrowAmount" placeholder="0.0">
            </div>
            <button class="action-btn" onclick="borrowTokens()">Borrow</button>
        </div>
    </div>

    <script>
        let provider, signer, userAddress;
        const tokens = {
            "ETH": "0x4200000000000000000000000000000000000006",
            "USDbC": "0xd9aAEc86B65D86f6a7B5B1b0c42FFA531710b6CA",
            "USDC": "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
        };
        const abi = [
            "function deposit(address token, uint256 amount) external",
            "function borrow(address token, uint256 amount) external"
        ];

        async function connectWallet() {
            if (window.ethereum) {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                document.getElementById("connectBtn").innerText = userAddress.substring(0, 6) + "..." + userAddress.substring(38);
            } else { alert("Install MetaMask!"); }
        }

        async function depositTokens() {
            const addr = document.getElementById("contractAddress").value;
            const token = tokens[document.getElementById("depositToken").value];
            const amount = document.getElementById("depositAmount").value;
            const contract = new ethers.Contract(addr, abi, signer);
            const tx = await contract.deposit(token, ethers.utils.parseUnits(amount, 18));
            await tx.wait();
            alert("Success!");
        }

        async function borrowTokens() {
            const addr = document.getElementById("contractAddress").value;
            const token = tokens[document.getElementById("borrowToken").value];
            const amount = document.getElementById("borrowAmount").value;
            const contract = new ethers.Contract(addr, abi, signer);
            const tx = await contract.borrow(token, ethers.utils.parseUnits(amount, 18));
            await tx.wait();
            alert("Success!");
        }
    </script>
</body>
</html>
